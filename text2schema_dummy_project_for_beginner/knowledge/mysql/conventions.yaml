type_mappings:
  string_short: "VARCHAR(255)"
  string_long: "TEXT"
  integer: "INT"
  big_integer: "BIGINT UNSIGNED"
  float: "DECIMAL(10,2)"
  boolean: "TINYINT(1)"
  timestamp: "DATETIME"
  json: "JSON"
  uuid: "CHAR(36)"

conventions:
  - "Use BIGINT UNSIGNED AUTO_INCREMENT for primary keys"
  - "Always use ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci"
  - "Always add created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP"
  - "Always add updated_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP"
  - "Use CHAR(36) for UUIDs (MySQL lacks native UUID type)"
  - "Prefer TEXT over VARCHAR for long content"
  - "Always define explicit foreign key indexes (MySQL requires them)"
  - "Use TINYINT(1) for boolean columns"
  - "Table names should be plural snake_case"
  - "Never exceed 64 characters for identifiers"

few_shot_examples:
  - input: "Blog platform with posts, authors, and comments"
    output_summary: |
      Tables: authors (id BIGINT UNSIGNED AUTO_INCREMENT PK, name VARCHAR(255),
      email VARCHAR(255) UNIQUE, bio TEXT, created_at DATETIME, updated_at DATETIME),
      posts (id, title VARCHAR(500), content LONGTEXT, author_id FK->authors,
      status ENUM('draft','published'), published_at DATETIME, slug VARCHAR(255) UNIQUE),
      comments (id, post_id FK->posts, author_id FK->authors, body TEXT, created_at)
      ENGINE=InnoDB DEFAULT CHARSET=utf8mb4
  - input: "Order management system"
    output_summary: |
      Tables: customers (id, name, email UNIQUE, phone VARCHAR(20)),
      orders (id, customer_id FK->customers, status ENUM, total_amount DECIMAL(10,2),
      created_at, updated_at),
      order_items (id, order_id FK->orders, product_name VARCHAR(255),
      quantity INT, unit_price DECIMAL(10,2))
